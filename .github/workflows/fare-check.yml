name: Check Budapest–Vienna train fares
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'First travel date (YYYY-MM-DD; blank = today)'
        default: ''
      scan_days:
        description: 'Number of days to search (1–60)'
        default: '8'
      passenger_age:
        description: 'Passenger age on the travel date'
        default: '22'
      direct_only:
        description: 'Direct connections only'
        type: boolean
        default: true
  push:
    paths:
      - 'src/**'
      - '.github/workflows/fare-check.yml'
  schedule:
    # GitHub cron uses UTC. Twice daily while monitoring this travel week.
    - cron: '15 5,17 * * *'
permissions:
  contents: write
concurrency:
  group: train-fare-check
  cancel-in-progress: false
jobs:
  check-fares:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Check MÁV fares
        id: fares
        env:
          SCAN_DAYS: ${{ inputs.scan_days || '8' }}
          END_DATE: '2026-11-08'
          EARLY_START_HOUR: '5'
          EARLY_END_HOUR: '9'
          START_DATE: ${{ inputs.start_date }}
          PASSENGER_AGE: ${{ inputs.passenger_age || '22' }}
          DIRECT_ONLY: ${{ github.event_name != 'workflow_dispatch' || inputs.direct_only }}
          PAUSE_MS: '1800'
          ALERT_BELOW_EUR: '25'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run check
      - name: Save reports and history to repository
        if: ${{ !cancelled() && steps.fares.outcome != 'skipped' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add REPORT.md docs/index.html data/latest.json data/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh daily rail fare report'
            git push
          fi
      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fare-report
          path: |
            REPORT.md
            data/latest.json
            data/history.json
          if-no-files-found: warn
          retention-days: 30
